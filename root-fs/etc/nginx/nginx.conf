error_log /proc/1/fd/2;
pid /tmp/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	multi_accept on;
	worker_connections 1024;
}

http {
	# Set an array of temp and cache file options that will otherwise default to
	# restricted locations accessible only to root.
	client_body_temp_path /tmp/client_body;
	fastcgi_temp_path /tmp/fastcgi_temp;
	proxy_temp_path /tmp/proxy_temp;
	scgi_temp_path /tmp/scgi_temp;
	uwsgi_temp_path /tmp/uwsgi_temp;
	sendfile on;
	tcp_nopush on;
	absolute_redirect off;
	types_hash_max_size 2048;
	client_max_body_size 1024;
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;
	fastcgi_buffering off;
	fastcgi_buffer_size 128k;        # header buffer
	fastcgi_buffers 4 128k;          # body buffers (won’t be used much with buffering off)
	fastcgi_busy_buffers_size 128k;  # must be < 4*128k = 512k

	# Access log as JSON (one object per line), e.g. to be fed to a SIEM.
	# The WebDAV token in the URL (`/_webdav-<TOKEN>/…`, see `nginx_bluespice`) is a credential
	# and therefore masked. Case-insensitive and including an encoded underscore (`%5F`), as the
	# raw `$request_uri` is logged. Everything up to the next `/` or `?` is replaced
	map $request_uri $log_request_uri {
		"~*^(.*?/(?:_|%5F)webdav-)[^/?]+(.*)$" "$1<TOKEN>$2";
		default $request_uri;
	}
	map $http_referer $log_http_referer {
		"~*^(.*?/(?:_|%5F)webdav-)[^/?]+(.*)$" "$1<TOKEN>$2";
		default $http_referer;
	}
	log_format json_combined escape=json
		'{'
			'"log_type":"nginx_access",'
			'"time":"$time_iso8601",'
			'"remote_addr":"$remote_addr",'
			'"x_forwarded_for":"$http_x_forwarded_for",'
			'"remote_user":"$remote_user",'
			'"host":"$host",'
			'"method":"$request_method",'
			'"uri":"$log_request_uri",'
			'"protocol":"$server_protocol",'
			'"status":$status,'
			'"body_bytes_sent":$body_bytes_sent,'
			'"request_length":$request_length,'
			'"request_time":$request_time,'
			'"upstream_response_time":"$upstream_response_time",'
			'"referer":"$log_http_referer",'
			'"user_agent":"$http_user_agent",'
			'"request_id":"$request_id"'
		'}';

	access_log /proc/1/fd/1 json_combined;
	error_log /proc/1/fd/2;

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}
