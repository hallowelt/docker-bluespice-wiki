environment:
    php: "/usr/bin/php"
wiki:
    # Taken from `_bluespice/.env.infrastructure.<edition>` of the codebase
    type: "###INTERNAL_PARALLEL_RUNJOBS_SERVICE_MODE###"
    path: "/app/bluespice/w"
# `redis` if the farm uses the shared job queue (see `start-task`), `database` otherwise
queue: "###PARALLEL_RUNJOBS_SERVICE_QUEUE|database###"
redis:
    host: "###JOBQUEUE_HOST|jobqueue###"
    port: ###JOBQUEUE_PORT|6379###
database:
    # `mysql` or `postgres`. The port defaults to the standard port of the type
    dbtype: "###DB_TYPE|mysql###"
    dbserver: "###DB_HOST###"
    # `postgres` only (`$wgDBmwschema`)
    dbschema: "###DB_SCHEMA|mediawiki###"
    dbname: "###DB_NAME###"
    dbuser: "###DB_USER###"
    dbpassword: "###DB_PASS###"
    dbprefix: "###DB_PREFIX###"
runjobs:
    cooldown: 5
farm:
    include-instances: []
    exclude-instances: []
